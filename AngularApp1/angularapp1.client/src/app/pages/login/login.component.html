<!-- Login: fondo Slate-50, tarjeta centrada con bordes finos al estilo Exportacion -->
<div style="min-height:100vh; width:100vw; background:#f8fafc; display:flex; align-items:center; justify-content:center; padding:24px;">

  <!-- Session Expired Banner -->
  <div *ngIf="sessionExpired"
    style="position:fixed; top:20px; left:50%; transform:translateX(-50%); z-index:100; background:#fef3c7; border:1px solid #f59e0b; border-radius:8px; padding:10px 20px; display:flex; align-items:center; gap:8px; font-family:'Lexend',sans-serif; font-size:12px; font-weight:500; color:#92400e;">
    <i class="pi pi-exclamation-triangle" style="font-size:13px;"></i>
    Sesión expirada — por favor ingrese de nuevo.
  </div>

  <!-- Login Card -->
  <div style="width:100%; max-width:380px; background:#ffffff; border:1px solid #e2e8f0; border-radius:12px; overflow:hidden; box-shadow:0 4px 24px rgba(15,23,42,0.07);">

    <!-- Card Header -->
    <div style="padding:28px 28px 20px; border-bottom:1px solid #e2e8f0; background:#f8fafc;">
      <div style="display:flex; align-items:center; gap:8px; margin-bottom:12px;">
        <div style="width:7px; height:7px; border-radius:50%; background:#0284c7; animation:pulse 2s ease-in-out infinite;"></div>
        <span style="font-family:'Lexend',sans-serif; font-size:10px; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; color:#0284c7;">CashFlow · Control</span>
      </div>
      <h1 style="font-family:'Lexend',sans-serif; font-size:22px; font-weight:700; color:#0f172a; margin:0 0 4px;">Acceso al Sistema</h1>
      <p style="font-family:'Lexend',sans-serif; font-size:12px; color:#64748b; margin:0; font-weight:400;">Ingrese sus credenciales para continuar</p>
    </div>

    <!-- Form -->
    <div style="padding:28px;">
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" id="login-form" style="display:flex; flex-direction:column; gap:18px;">

        <!-- Email -->
        <div>
          <label style="display:block; font-family:'Lexend',sans-serif; font-size:11px; font-weight:600; color:#475569; margin-bottom:6px; letter-spacing:0.02em;">
            Correo Electrónico
          </label>
          <div style="position:relative;">
            <input
              id="login-email"
              type="email"
              formControlName="email"
              placeholder="usuario@empresa.com"
              autocomplete="email"
              class="cf-input"
              style="width:100%; background:#f8fafc; border:1px solid #e2e8f0; border-radius:8px; padding:10px 36px 10px 12px; font-family:'Lexend',sans-serif; font-size:13px; color:#0f172a; outline:none; box-sizing:border-box; transition:border-color 150ms ease, box-shadow 150ms ease;"
              [style.borderColor]="(emailControl?.invalid && emailControl?.touched) ? '#e11d48' : '#e2e8f0'">
            <i class="pi pi-envelope" style="position:absolute; right:11px; top:50%; transform:translateY(-50%); font-size:12px; color:#94a3b8;"></i>
          </div>
          <p *ngIf="emailControl?.invalid && emailControl?.touched" style="margin:4px 0 0; font-family:'Lexend',sans-serif; font-size:11px; color:#e11d48;">
            <span *ngIf="emailControl?.errors?.['required']">El correo es obligatorio.</span>
            <span *ngIf="emailControl?.errors?.['email']">Ingrese un correo válido.</span>
          </p>
        </div>

        <!-- Password -->
        <div>
          <label style="display:block; font-family:'Lexend',sans-serif; font-size:11px; font-weight:600; color:#475569; margin-bottom:6px; letter-spacing:0.02em;">
            Contraseña
          </label>
          <div style="position:relative;">
            <input
              id="login-password"
              [type]="showPassword ? 'text' : 'password'"
              formControlName="password"
              placeholder="••••••••"
              autocomplete="current-password"
              class="cf-input"
              style="width:100%; background:#f8fafc; border:1px solid #e2e8f0; border-radius:8px; padding:10px 36px 10px 12px; font-family:'Lexend',sans-serif; font-size:13px; color:#0f172a; outline:none; box-sizing:border-box; transition:border-color 150ms ease, box-shadow 150ms ease;"
              [style.borderColor]="(passwordControl?.invalid && passwordControl?.touched) ? '#e11d48' : '#e2e8f0'">
            <button
              type="button"
              (click)="togglePassword()"
              style="position:absolute; right:10px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; color:#94a3b8; padding:0; display:flex; align-items:center;">
              <i [class]="showPassword ? 'pi pi-eye-slash' : 'pi pi-eye'" style="font-size:13px;"></i>
            </button>
          </div>
          <p *ngIf="passwordControl?.invalid && passwordControl?.touched" style="margin:4px 0 0; font-family:'Lexend',sans-serif; font-size:11px; color:#e11d48;">
            La contraseña es obligatoria.
          </p>
        </div>

        <!-- Submit -->
        <button
          id="login-submit"
          type="submit"
          [disabled]="isLoading"
          style="width:100%; padding:12px; border:none; border-radius:8px; background:#0284c7; color:#ffffff; font-family:'Lexend',sans-serif; font-size:13px; font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; transition:background 150ms ease, opacity 150ms ease; margin-top:4px;"
          [style.opacity]="isLoading ? '0.65' : '1'"
          [style.cursor]="isLoading ? 'not-allowed' : 'pointer'"
          onmouseover="if(!this.disabled) this.style.background='#0369a1'"
          onmouseout="this.style.background='#0284c7'">
          <i *ngIf="!isLoading" class="pi pi-lock" style="font-size:13px;"></i>
          <i *ngIf="isLoading" class="pi pi-spin pi-spinner" style="font-size:13px;"></i>
          <span>{{ isLoading ? 'Autenticando...' : 'Iniciar Sesión' }}</span>
        </button>

      </form>
    </div>

    <!-- Card Footer -->
    <div style="padding:12px 28px 16px; background:#f8fafc; border-top:1px solid #e2e8f0;">
      <p style="margin:0; font-family:'JetBrains Mono',monospace; font-size:10px; color:#94a3b8; text-align:center; letter-spacing:0.06em; text-transform:uppercase;">
        Sesión segura · JWT · Expiración 8h
      </p>
    </div>

  </div>

</div>

<style>
  .cf-input:focus {
    border-color: #0284c7 !important;
    box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.12) !important;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
</style>
