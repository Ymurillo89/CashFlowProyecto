<div class="min-h-screen w-screen bg-app-bg flex items-center justify-center relative overflow-hidden">
  
  <!-- Ambient Background Grid -->
  <div class="absolute inset-0 opacity-5" style="background-image: linear-gradient(var(--color-panel-border) 1px, transparent 1px), linear-gradient(90deg, var(--color-panel-border) 1px, transparent 1px); background-size: 40px 40px;"></div>

  <!-- Glow accent -->
  <div class="absolute top-1/3 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 rounded-full opacity-10 blur-3xl" style="background: radial-gradient(circle, var(--color-brand-primary), transparent);"></div>

  <!-- Login Panel -->
  <div class="relative z-10 w-full max-w-sm mx-4">

    <!-- Session Expired Banner -->
    <div *ngIf="sessionExpired" class="mb-4 border border-amber-500/50 bg-amber-500/10 text-amber-400 font-mono text-xs px-4 py-2 flex items-center space-x-2">
      <i class="pi pi-exclamation-triangle"></i>
      <span>SESIÓN EXPIRADA — Inicie sesión de nuevo.</span>
    </div>

    <!-- Card -->
    <div class="border border-panel-border bg-panel-bg relative">
      <!-- Corner reticles -->
      <div class="absolute top-0 left-0 w-3 h-3 border-t-2 border-l-2 border-brand-primary -translate-x-px -translate-y-px"></div>
      <div class="absolute top-0 right-0 w-3 h-3 border-t-2 border-r-2 border-brand-primary translate-x-px -translate-y-px"></div>
      <div class="absolute bottom-0 left-0 w-3 h-3 border-b-2 border-l-2 border-brand-primary -translate-x-px translate-y-px"></div>
      <div class="absolute bottom-0 right-0 w-3 h-3 border-b-2 border-r-2 border-brand-primary translate-x-px translate-y-px"></div>

      <!-- Header -->
      <div class="p-6 border-b border-panel-border">
        <div class="flex items-center space-x-3 mb-1">
          <div class="w-2 h-2 bg-brand-primary rounded-full animate-pulse"></div>
          <span class="font-mono text-xs tracking-widest font-bold uppercase text-brand-primary">CashFlow Control AI</span>
        </div>
        <h1 class="text-lg font-bold text-text-main mt-2">Acceso al Sistema</h1>
        <p class="text-[11px] font-mono text-text-muted mt-1 uppercase tracking-wider">Autenticación Segura · JWT</p>
      </div>

      <!-- Form -->
      <div class="p-6">
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-5" id="login-form">

          <!-- Email -->
          <div>
            <label class="block text-[10px] font-mono uppercase tracking-widest text-text-muted mb-1">
              Correo Electrónico
            </label>
            <div class="relative">
              <input
                id="login-email"
                type="email"
                formControlName="email"
                placeholder="usuario@empresa.com"
                autocomplete="email"
                class="w-full bg-app-bg border px-3 py-2 text-sm font-mono text-text-main placeholder-text-muted/40 focus:outline-none transition"
                [class.border-brand-error]="emailControl?.invalid && emailControl?.touched"
                [class.border-panel-border]="!(emailControl?.invalid && emailControl?.touched)"
                [class.focus:border-brand-primary]="true">
              <i class="pi pi-envelope absolute right-3 top-1/2 -translate-y-1/2 text-text-muted text-xs"></i>
            </div>
            <p *ngIf="emailControl?.invalid && emailControl?.touched" class="text-[10px] text-brand-error font-mono mt-1">
              <span *ngIf="emailControl?.errors?.['required']">El correo es obligatorio.</span>
              <span *ngIf="emailControl?.errors?.['email']">Ingrese un correo válido.</span>
            </p>
          </div>

          <!-- Password -->
          <div>
            <label class="block text-[10px] font-mono uppercase tracking-widest text-text-muted mb-1">
              Contraseña
            </label>
            <div class="relative">
              <input
                id="login-password"
                [type]="showPassword ? 'text' : 'password'"
                formControlName="password"
                placeholder="••••••••"
                autocomplete="current-password"
                class="w-full bg-app-bg border px-3 py-2 pr-10 text-sm font-mono text-text-main placeholder-text-muted/40 focus:outline-none transition"
                [class.border-brand-error]="passwordControl?.invalid && passwordControl?.touched"
                [class.border-panel-border]="!(passwordControl?.invalid && passwordControl?.touched)">
              <button
                type="button"
                (click)="togglePassword()"
                class="absolute right-3 top-1/2 -translate-y-1/2 text-text-muted hover:text-text-main transition">
                <i [class]="showPassword ? 'pi pi-eye-slash text-xs' : 'pi pi-eye text-xs'"></i>
              </button>
            </div>
            <p *ngIf="passwordControl?.invalid && passwordControl?.touched" class="text-[10px] text-brand-error font-mono mt-1">
              La contraseña es obligatoria.
            </p>
          </div>

          <!-- Submit -->
          <button
            id="login-submit"
            type="submit"
            [disabled]="isLoading"
            class="w-full py-2.5 font-mono text-xs uppercase tracking-widest transition relative overflow-hidden"
            [class.opacity-60]="isLoading"
            [class.cursor-not-allowed]="isLoading"
            style="background: var(--color-brand-primary); color: #000; font-weight: 700;">

            <span *ngIf="!isLoading" class="flex items-center justify-center space-x-2">
              <i class="pi pi-lock text-xs"></i>
              <span>Iniciar Sesión</span>
            </span>
            <span *ngIf="isLoading" class="flex items-center justify-center space-x-2">
              <i class="pi pi-spin pi-spinner text-xs"></i>
              <span>Autenticando...</span>
            </span>
          </button>

        </form>
      </div>

      <!-- Footer -->
      <div class="px-6 pb-4 text-[9px] font-mono text-text-muted/50 text-center uppercase tracking-widest">
        Sesión segura · Token JWT · Expiración 8h
      </div>
    </div>

    <!-- System info -->
    <div class="mt-3 text-[9px] font-mono text-text-muted/40 text-center uppercase tracking-widest">
      NÚCLEO: .NET 8 + PostgreSQL · CLIENTE: Angular
    </div>
  </div>
</div>
